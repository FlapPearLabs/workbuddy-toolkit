name: CI Cross-Platform Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']

    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile bin/workbuddy
          python -m py_compile install.py
          python -m py_compile uninstall.py

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Test Native Shell Installer (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          bash ./install.sh
          bash ./uninstall.sh

      - name: Test Native PowerShell Installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          powershell -ExecutionPolicy Bypass -File .\uninstall.ps1

  security-leak-scan:
    name: Zero-Leak Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for private credentials, tokens, and hardcoded home paths
        run: |
          python3 -c "
          import os, re, sys
          patterns = [
              (r'/Users/(?!runner\b)[a-zA-Z0-9_\-]+', 'macOS local user home path'),
              (r'C:\\\\Users\\\\(?!runneradmin\b)[a-zA-Z0-9_\-]+', 'Windows local user home path'),
              (r'/home/(?!runner\b)[a-zA-Z0-9_\-]+', 'Linux local user home path'),
              (r'eyJh[A-Za-z0-9_\-\.]{25,}', 'JWT Bearer token'),
              (r'1[3-9]\d{9}', 'Mainland China 11-digit phone number')
          ]
          leaks = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root or '__pycache__' in root:
                  continue
              for f in files:
                  p = os.path.join(root, f)
                  with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                      text = fp.read()
                      for pat, desc in patterns:
                          # 忽略测试文件中的假时间戳 (如 1800000000000)
                          matches = [m for m in re.findall(pat, text) if not (desc.startswith('Mainland') and ('1800000000' in m or '1900000000' in m))]
                          if matches:
                              leaks.append((p, desc, matches[:3]))
          if leaks:
              print('Security scan failed! Leaks found:', leaks)
              sys.exit(1)
          print('Security scan passed: Zero hardcoded user paths or credentials detected.')
          "
