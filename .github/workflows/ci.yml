name: CI Cross-Platform Matrix

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']

    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile bin/workbuddy
          python -m py_compile install.py
          python -m py_compile uninstall.py

      - name: Run Automated Test Suite
        run: |
          python scripts/ci_test_report.py tests

      # 变异校验进 CI（维护者建议）：把每处修复改坏证明用例真的会红。
      # 脚本按平台自动选择变异——Windows 上会验证 msvcrt 拆锁那条。
      - name: Mutation Check (every fix must be provably covered)
        run: |
          python scripts/mutation_check.py

      # 显式一步：在真实的 macOS / Linux 文件系统上跑删除路径（真实的
      # os.replace、真实的 st_dev），而不是只依赖汇总脚本里的隐式执行。
      - name: POSIX delete path (real os.replace, no mocks)
        if: runner.os != 'Windows'
        run: |
          python -m unittest tests.test_profile_remove -v

      - name: Test Native Shell Installer (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          bash ./install.sh
          bash ./uninstall.sh

      - name: Test Native PowerShell Installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          powershell -ExecutionPolicy Bypass -File .\uninstall.ps1

  security-leak-scan:
    name: Zero-Leak Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan for private credentials, tokens, and hardcoded home paths
        run: python3 scripts/leak_scan.py .
